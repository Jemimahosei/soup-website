services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: soup
      POSTGRES_PASSWORD: soup
      POSTGRES_DB: soup
    ports:
      - "5432:5432"
    volumes:
      - soup_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U soup -d soup"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgres://soup:soup@db:5432/soup
      PORT: 3001
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: soup-admin
    ports:
      - "3001:3001"
    depends_on:
      db:
        condition: service_healthy
    command: ["sh", "-c", "npm run migrate && npm run seed && npm start"]

  web:
    build: ./frontend
    environment:
      VITE_API_URL: http://localhost:3001/api
    ports:
      - "4173:4173"
    depends_on:
      - api

volumes:
  soup_pgdata:
